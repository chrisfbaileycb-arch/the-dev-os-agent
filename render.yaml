services:
  - type: web
    name: hey-buddy-web
    runtime: docker
    rootDir: web
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/providers
    disk:
      name: workspace-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: APP_ORIGIN
        sync: false
      - key: DATA_DIR
        value: /data
      - key: CREDIT_MONTHLY_POOL
        value: "100000"
      - key: BROWSE_ALLOWED_HOSTS
        sync: false
