# Render Blueprint for the Hey Buddy web edition.
# Create it from the dashboard: New > Blueprint, pick this repo, branch main.
#
# ONE standard Node web service. No Docker, no persistent disk, no background worker — this
# file matches the service actually running at https://hey-buddy-web.onrender.com so that
# recreating it from the Blueprint reproduces what is live, rather than a different topology.
#
# What that costs, stated plainly so it is a choice and not a surprise:
#
#   No Chromium.      The Browser Agent persona cannot run; /api/browse answers 503. Everything
#                     else works, including the URL crawler connector, which needs no browser.
#
#   No disk.          SQLite lives at DATA_FILE and is wiped on every restart and redeploy.
#                     Sessions, runs, and the ledger are reconstructed from each browser's own
#                     IndexedDB copy, so a returning visitor keeps their history; what does not
#                     survive is the server's record. The free-tier monthly quota resets with it,
#                     which makes FREE_MAX_PER_HOUR — an in-memory per-IP window — the cap that
#                     actually bounds spend on the deployment's keys.
#
#   No worker.        Multi-step agent workflows run in the visitor's own browser Web Worker,
#                     which is the default path regardless. /api/jobs reports `worker: false`
#                     and the queue stays idle. The worker code (server/worker.mjs) is kept and
#                     tested so a second service can be added later without a rewrite.
#
# To get the durable version — Chromium for the Browser Agent, a 1 GB disk so the ledger and the
# free-tier quota persist, and a background worker for heavy runs — see "Scaling up" in
# web/README.md, which describes the Docker-plus-disk topology this file previously declared.

services:
  - type: web
    name: hey-buddy-web
    runtime: node
    # Free plan: no disk, and the instance sleeps after inactivity (first request then takes a
    # few seconds to wake). Move to `starter` for an always-on instance.
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    rootDir: packages/web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    # Answers 200 with no database and no provider key present, which is why it is the probe.
    healthCheckPath: /api/providers
    envVars:
      - key: NODE_VERSION
        value: "22"
      # node:sqlite needs Node 22+. Chromium is not installed on this runtime, so skip the
      # download that playwright's postinstall would otherwise attempt.
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
      # Ephemeral by design on a diskless plan. /tmp is writable on Render.
      - key: DATA_FILE
        value: /tmp/heybuddy.sqlite

      # --- Zero-config free tier -------------------------------------------------------
      # Set one or both and visitors get a live streaming reply with no API key and no account:
      # the server funds an allowlisted set of free models from its own keys. Leave them unset
      # and the app still runs — it shows "Public free tier warming up" and asks for a key.
      # Enter the real values in the dashboard; `sync: false` keeps them out of this file.
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # xKiro unified gateway (https://api.xkiro.com/v1) — many model families behind one
      # OpenAI-compatible endpoint. This key alone is enough to switch the free tier on: the
      # server discovers which of the gateway's models are free and funds those, so no model id
      # is configured here or compiled into the build.
      - key: XKIRO_API_KEY
        sync: false
      # The gateway's base URL. Defaults to https://api.xkiro.com/v1; set it to move regions or
      # follow a versioned path. HTTPS only — anything malformed falls back to the default.
      - key: XKIRO_BASE_URL
        value: https://api.xkiro.com/v1
      # Optional narrowing of the discovered free pool: "of everything the gateway gives away,
      # fund only these ids". It intersects with what discovery found rather than replacing it,
      # so an id the gateway does not give away is refused instead of funded — a typo shrinks the
      # free tier rather than putting an unpriced model on the operator's card. Blank funds the
      # whole free pool, which is the intended setting for most deployments.
      - key: XKIRO_FREE_MODELS
        value: ""
      # Credits per workspace per month at 0.5 credits per 1K tokens (400 ≈ 800,000 tokens).
      # Metered on the server from the bytes that actually streamed. Resets on restart here.
      - key: FREE_CREDIT_MONTHLY_POOL
        value: "400"
      # Per-IP burst cap. With no disk this is the binding constraint on free-tier spend, since
      # the workspace id is browser-minted and the monthly quota does not survive a restart.
      - key: FREE_MAX_PER_HOUR
        value: "40"
      - key: FREE_MAX_OUTPUT_TOKENS
        value: "1024"
      # "true" switches the tier off without removing the provider keys.
      - key: FREE_TIER_DISABLED
        value: "false"

      # --- Platform credits (separate budget, administrator-gated) -----------------------
      - key: CREDIT_MONTHLY_POOL
        value: "100000"

      # --- Connectors ------------------------------------------------------------------
      # Hey Buddy's own paid plans. A hosted checkout URL per plan — a Stripe Payment Link is the
      # simplest thing that works. Until one is set the Plans page keeps the price and the feature
      # list but says checkout is not open, rather than putting a Subscribe button over a dead
      # link. These are public URLs by design; the processor's secret key never reaches this
      # server. Setting them here is a dashboard edit and a restart, never a rebuild.
      - key: STRIPE_STARTER_URL
        sync: false
      - key: STRIPE_PREMIUM_URL
        sync: false
      # URL crawler (/api/fetch): a plain GET converted to text server-side, so the browser can
      # read external pages despite CORS. Open to any public host; set a list to narrow it.
      - key: FETCH_ALLOWED_HOSTS
        value: ""
      - key: FETCH_MAX_PER_HOUR
        value: "60"
      # GitHub connector (/api/github): read-only. A server token is optional — visitors may
      # supply their own in the Connectors hub.
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_MAX_PER_HOUR
        value: "120"
      # Browser Agent: inert on this runtime (no Chromium), so the allowlist stays empty.
      - key: BROWSE_ALLOWED_HOSTS
        value: ""
      - key: BROWSE_MAX_PER_HOUR
        value: "30"
      - key: MCP_MAX_PER_HOUR
        value: "120"

      # APP_ORIGIN is deliberately unset. The server falls back to matching the request Origin
      # against its own Host, which is correct on Render. Set it only to pin a single external
      # origin, and never to a guessed URL: a wrong value makes every API call fail with 403.
