# Render Blueprint for the Signal Forge OS web edition.
# Create it from the dashboard: New > Blueprint, pick this repo, branch main.
#
# One standard Node web service and a free test Postgres database. No Docker, persistent
# disk or worker. The existing live service retains its instance plan and compatibility
# build commands; creating this Blueprint provisions a separate free test topology.
#
# What that costs, stated plainly so it is a choice and not a surprise:
#
#   No Chromium.      The Browser Agent persona cannot run; /api/browse answers 503. Everything
#                     else works, including the URL crawler connector, which needs no browser.
#
#   No disk.          DATABASE_URL below makes workspace data, owner settings and the daily
#                     USD reservation ledger durable in Postgres. Without durable storage,
#                     owner-funded inference fails closed. The rolling anonymous request
#                     cache resets on restart; the database spending ledger does not.
#                     The free test database expires after 30 days and has no backups.
#
#   No worker.        Multi-step agent workflows run in the visitor's own browser Web Worker,
#                     which is the default path regardless. /api/jobs reports `worker: false`
#                     and the queue stays idle. The worker code (server/worker.mjs) is kept and
#                     tested so a second service can be added later without a rewrite.
#
# Chromium, a worker and durable resumable execution need separate provisioning and testing.
# See docs/render-setup.md for owner setup and current limitations.

databases:
  - name: hey-buddy-db
    # Test database: expires after 30 days. Upgrade or replace before saving production data.
    plan: free
    region: oregon
    databaseName: heybuddy
    user: heybuddy

services:
  - type: web
    name: hey-buddy-web
    runtime: node
    # Free plan: no disk, and the instance sleeps after inactivity (first request then takes a
    # few seconds to wake). Move to `starter` for an always-on instance.
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm ci && cd packages/web && npm run build
    startCommand: node packages/web/server/index.mjs
    # Verify the static workspace page separately during release checks.
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hey-buddy-db
          property: connectionString
      - key: NODE_VERSION
        value: "22"
      # node:sqlite needs Node 22+. Chromium is not installed on this runtime, so skip the
      # download that playwright's postinstall would otherwise attempt.
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
      # Ephemeral by design on a diskless plan. /tmp is writable on Render.
      - key: DATA_FILE
        value: /tmp/heybuddy.sqlite

      # --- Private beta gate -------------------------------------------------------------
      # The passcode visitors enter before the workspace loads. Vite reads it during the BUILD
      # and bakes in only a salted hash, so change it here and redeploy. Left unset, a production
      # build locks everyone out rather than opening. It is a front-end curtain, not server auth.
      - key: VITE_BETA_ACCESS_KEY
        sync: false

      # --- Admin dashboard ---------------------------------------------------------------
      # A generated owner bootstrap code permits initial password creation at /admin. Copy
      # it from Render Environment; after setup remove it. SESSION_SECRET signs workspace
      # ownership and SETTINGS_SECRET seals operator settings. Never put these in source.
      - key: ADMIN_BOOTSTRAP_TOKEN
        generateValue: true
      - key: SETTINGS_SECRET
        generateValue: true
      - key: WORKSPACE_AUTH_REQUIRED
        value: "true"
      - key: OPERATOR_FUNDING_DISABLED
        value: "true"

      # --- Zero-config free tier -------------------------------------------------------
      # Set one or both and visitors get a live streaming reply with no API key and no account:
      # the server funds an allowlisted set of free models from its own keys. Leave them unset
      # and the app still runs — it shows "Public free tier warming up" and asks for a key.
      # Enter the real values in the dashboard; `sync: false` keeps them out of this file.
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # xKiro unified gateway (https://api.xkiro.com/v1) — many model families behind one
      # OpenAI-compatible endpoint. This key alone is enough to switch the free tier on: the
      # server discovers which of the gateway's models are free and funds those, so no model id
      # is configured here or compiled into the build.
      - key: XKIRO_API_KEY
        sync: false
      # The gateway's base URL. Defaults to https://api.xkiro.com/v1; set it to move regions or
      # follow a versioned path. HTTPS only — anything malformed falls back to the default.
      - key: XKIRO_BASE_URL
        value: https://api.xkiro.com/v1
      # Optional narrowing of the discovered free pool: "of everything the gateway gives away,
      # fund only these ids". It intersects with what discovery found rather than replacing it,
      # so an id the gateway does not give away is refused instead of funded — a typo shrinks the
      # free tier rather than putting an unpriced model on the operator's card. Blank funds the
      # whole free pool, which is the intended setting for most deployments.
      - key: XKIRO_FREE_MODELS
        value: ""
      # Free monthly credits are off. A visitor sends with a paid plan token or their own key.
      # Raising this pool, and setting FREE_TIER_DISABLED to "false", is how an operator turns it back on.
      - key: FREE_CREDIT_MONTHLY_POOL
        value: "0"
      # Rolling IP + User-Agent cap. This resets with the process; the USD ledger does not.
      - key: FREE_MAX_PER_HOUR
        value: "40"
      - key: FREE_MAX_OUTPUT_TOKENS
        value: "16384"
      # No new spending authorized. Positive caps additionally require durable storage and
      # reviewed per-route pricing/context bounds. Owner funding stays disabled independently.
      - key: DAILY_SERVER_BUDGET_USD
        value: "0"
      - key: MANAGED_MODEL_COST_BOUNDS_JSON
        value: "[]"
      # There is no longer a switch for US-only funding: the server funds only the backend lane
      # (OpenAI, Anthropic, Google, Groq, xAI; see server/providerRegistry.mjs). Add those keys, and pick
      # which of their models are free or paid, in the admin dashboard. Every other provider is
      # used with a key the visitor types into the browser.
      # "true" switches the tier off without removing the provider keys. That is the default.
      - key: FREE_TIER_DISABLED
        value: "true"

      # --- Monthly subscriptions: limits are enforced per individual access token -------
      - key: PLAN_STARTER_CREDITS
        value: "1000"
      - key: PLAN_PREMIUM_CREDITS
        value: "2500"
      - key: PLAN_PRO_CREDITS
        value: "6000"
      - key: PLAN_STARTER_MAX_OUTPUT_TOKENS
        value: "16384"
      - key: PLAN_PREMIUM_MAX_OUTPUT_TOKENS
        value: "32768"
      - key: PLAN_PRO_MAX_OUTPUT_TOKENS
        value: "65536"
      # Unique subscriber tokens and new-price checkout URLs can be entered in Admin.
      # Old $12.90/$24.90 STRIPE_* links are intentionally not reused.
      - key: PLAN_STARTER_ACCESS_TOKENS
        sync: false
      - key: PLAN_PREMIUM_ACCESS_TOKENS
        sync: false
      - key: PLAN_PRO_ACCESS_TOKENS
        sync: false
      - key: BILLING_STARTER_URL
        sync: false
      - key: BILLING_PREMIUM_URL
        sync: false
      - key: BILLING_PRO_URL
        sync: false
      # --- Connectors ------------------------------------------------------------------
      # URL crawler (/api/fetch): a plain GET converted to text server-side, so the browser can
      # read external pages despite CORS. Open to any public host; set a list to narrow it.
      - key: FETCH_ALLOWED_HOSTS
        value: ""
      - key: FETCH_MAX_PER_HOUR
        value: "60"
      # GitHub connector (/api/github): read-only. A server token is optional — visitors may
      # supply their own in the Connectors hub.
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_MAX_PER_HOUR
        value: "120"
      # Browser Agent: inert on this runtime (no Chromium), so the allowlist stays empty.
      - key: BROWSE_ALLOWED_HOSTS
        value: ""
      - key: BROWSE_MAX_PER_HOUR
        value: "30"
      - key: MCP_MAX_PER_HOUR
        value: "120"

      # --- Google OAuth (optional) -------------------------------------------------------
      # Set all three to enable "Sign in with Google". Without them the sign-in button is hidden
      # and all workspace data stays in the anonymous browser-minted workspace id.
      # Create credentials at console.cloud.google.com → APIs & Services → Credentials.
      # Authorized redirect URI: https://<your-domain>/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Any long random string: openssl rand -hex 32
      - key: SESSION_SECRET
        generateValue: true

      # APP_ORIGIN is deliberately unset. The server falls back to matching the request Origin
      # against its own Host, which is correct on Render. Set it only to pin a single external
      # origin, and never to a guessed URL: a wrong value makes every API call fail with 403.
