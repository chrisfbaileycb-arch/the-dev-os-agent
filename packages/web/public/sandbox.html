<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>html,body{margin:0;padding:0;min-height:100%;font:13px/1.5 -apple-system,sans-serif;}</style>
</head>
<body>
<div id="root"></div>
<script>
/* __PREVIEW_SCRIPT_PARSER__ */
// The generated-app sandbox shell.
//
// A `srcdoc` iframe inherits its embedding document's Content-Security-Policy and intersects it
// with anything the srcdoc content sets for itself, so the main app's strict script-src (no
// 'unsafe-inline', for the main app's own real protection against injected scripts) silently
// blocked every generated app's inline bundle — sandboxed or not, the inherited policy still
// applied. A real navigation does not inherit anything: this file is fetched as its own HTTP
// response, and the server gives *this one path* its own, separately-scoped CSP that allows what
// a generated app legitimately needs to run (see server/csp.mjs). Everything else on this origin
// keeps the strict policy; only this fixed, server-authored shell gets the looser one, and what's
// injected into it never sees this origin's cookies or storage — the iframe embedding this page
// carries sandbox="allow-scripts" with no allow-same-origin, so this document's origin is opaque
// no matter which URL served it.
//
// That opaque origin has one side effect worth handling here: `localStorage` and `sessionStorage`
// throw a SecurityError in a document that has no origin, and a generated to-do list that saves
// its items is the single most common thing people ask for. So a small script is prepended to
// every page before it is written, giving the page in-memory storage that behaves like the real
// thing for as long as the preview is open. It also reports the first uncaught runtime error in
// a banner, since a page that silently does nothing is the least debuggable failure there is.
var SHIM = '<script>(function(){' +
  'function mem(){var m=new Map();return{get length(){return m.size},key:function(i){return Array.from(m.keys())[i]||null},getItem:function(k){return m.has(String(k))?m.get(String(k)):null},setItem:function(k,v){m.set(String(k),String(v))},removeItem:function(k){m.delete(String(k))},clear:function(){m.clear()}}}' +
  'function blocked(n){try{var s=window[n];s.getItem;return false}catch(e){return true}}' +
  '["localStorage","sessionStorage"].forEach(function(n){if(blocked(n)){try{Object.defineProperty(window,n,{value:mem(),configurable:true})}catch(e){}}});' +
  // Opaque previews have no service-worker capability. Remove a throwing feature getter so
  // standard feature detection is truthful instead of crashing before register().catch().
  'if(self.origin==="null"){var np=navigator;while(np){if(Object.prototype.hasOwnProperty.call(np,"serviceWorker")){try{delete np.serviceWorker}catch(e){}break}np=Object.getPrototypeOf(np)}}' +
  'function tell(state,msg){try{window.parent.postMessage({type:"sf-preview",state:state,message:String(msg||"").slice(0,300)},"*")}catch(e){try{parent.postMessage({type:"sf-preview",state:state,message:String(msg||"").slice(0,300)},"*")}catch(e){}}}' +
  'var origAEL=window.addEventListener;' +
  'window.addEventListener=function(t,l,o){if(t==="DOMContentLoaded"&&document.readyState!=="loading"){try{setTimeout(function(){typeof l==="function"?l.call(window,new Event("DOMContentLoaded")):l&&l.handleEvent&&l.handleEvent(new Event("DOMContentLoaded"))},0)}catch(e){}return}return origAEL.apply(this,arguments)};' +
  'var origDocAEL=document.addEventListener;' +
  'document.addEventListener=function(t,l,o){if(t==="DOMContentLoaded"&&document.readyState!=="loading"){try{setTimeout(function(){typeof l==="function"?l.call(document,new Event("DOMContentLoaded")):l&&l.handleEvent&&l.handleEvent(new Event("DOMContentLoaded"))},0)}catch(e){}return}return origDocAEL.apply(this,arguments)};' +
  'var failed=false;window.addEventListener("load",function(){setTimeout(function(){if(failed)return;var b=document.body;var seen=b&&((b.innerText||"").trim().length>0||b.querySelector("canvas,svg,img,video,iframe,input,button,select,textarea"));tell(seen?"ready":"blank")},1200)});' +
  'var shown=false;function report(e){if(window.__sfTrying&&/has already been declared|redeclaration of|duplicate variable/i.test(e.message||"")){return}failed=true;tell("error",e.message);if(shown)return;shown=true;var b=document.createElement("pre");b.setAttribute("data-preview-error","");b.style.cssText="position:fixed;left:8px;right:8px;bottom:8px;z-index:2147483647;margin:0;padding:8px 10px;background:#fff3f2;color:#b8362b;border:1px solid #f0b8b2;border-radius:6px;font:12px/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap;box-shadow:0 4px 16px rgba(0,0,0,.15)";b.textContent="Runtime error: "+(e.message||"unknown")+(e.filename?"\\n"+e.filename.replace(/^.*\\//,"")+":"+e.lineno:"");(document.body||document.documentElement).appendChild(b)}' +
  'window.addEventListener("error",report);' +
  'window.addEventListener("error",function(e){var t=e.target;if(t&&t.tagName==="SCRIPT"&&t.src){t.__sfFailed=true;report({message:"Script failed to load: "+t.src})}},true);' +
  'window.addEventListener("unhandledrejection",function(e){report({message:"Async initialization error: "+String(e.reason&&e.reason.message||e.reason||"unknown")})});' +
  'document.addEventListener("webglcontextlost",function(){report({message:"WebGL context lost. Reload the preview to initialize the scene again."})},true);' +
  '})()<\/script>';

// Generated pages routinely write `import * as THREE from 'three'` inside a plain <script>, or in a
// module script with no way to resolve the bare name "three". Wrapping such a script in a function
// (below) is a guaranteed "Cannot use import statement outside a module", and a module with a bare
// specifier fails with "Failed to resolve module specifier". So a script that uses ES module syntax
// is promoted to a real, unwrapped module, and an import map is supplied for the bare names it uses.
// Modules are deferred, so they never need the DOMContentLoaded wrapper either.
// (src/lib/project.ts has the same test for raw script replies; keep the two in step.)
var MODULE_SYNTAX = /^[ \t]*import\s*(?:[\w$*{][^;\n]*?\s*from\s*)?['"]|^[ \t]*export\s+(?:default\b|const\b|let\b|var\b|function\b|class\b|async\b|\{|\*)/m;
var THREE_VERSION = '0.170.0';
var THREE_CDN = 'https://cdn.jsdelivr.net/npm/three@' + THREE_VERSION + '/';

function isJsType(attrs) {
  var typeMatch = attrs.match(/\btype\s*=\s*["']?([^"'\s>]+)/i);
  if (!typeMatch) return 'classic';
  var t = typeMatch[1].toLowerCase();
  if (t === 'module') return 'module';
  if (t === 'text/javascript' || t === 'application/javascript' || t === 'javascript') return 'classic';
  return null;
}

// Runs one page script after the DOM is ready, as a real classic script, so its top-level names are
// global and the page's inline handlers can reach them. A script that re-declares a top-level const,
// let or class from an earlier script is refused by the browser as a whole, before any of it runs, and
// long generated pages do this often; the old function wrapper hid it. So that case, and only that
// case, runs the same code inside a function instead, with the names it declares copied onto the
// window so the page's other scripts and inline handlers still find them. The browser refuses before
// running anything, so nothing runs twice, and every other error is reported as it always was. This is a real function
// handed to each page as source text (RUN_DEFERRED below), so it must not refer to anything outside
// itself.
function runDeferredScript(code, names) {
  var REDECLARED = /has already been declared|redeclaration of|duplicate variable/i;
  var redeclared = false;
  function onError(e) {
    if (!REDECLARED.test(String(e && e.message))) return;
    redeclared = true; e.preventDefault(); e.stopImmediatePropagation();
  }
  // The shell's own error banner listens first, so it is told (through this flag) to leave a duplicate
  // declaration alone while this attempt is in flight; the fallback below handles it.
  window.__sfTrying = true;
  window.addEventListener("error", onError, true);
  try {
    var s = document.createElement("script");
    s.textContent = code;
    (document.head || document.documentElement).appendChild(s);
    if (s.parentNode) s.parentNode.removeChild(s);
  } catch (e) {
    if (REDECLARED.test(String(e && e.message))) redeclared = true; else throw e;
  } finally {
    window.removeEventListener("error", onError, true);
    window.__sfTrying = false;
  }
  if (!redeclared) return;
  // Parser-selected script bindings only: nested locals, comments and strings never become globals.
  // Install closures before execution so initialized data survives a later rendering exception.
  var exported = names.map(function (n) {
    return ";if(!(\"" + n + "\" in window))Object.defineProperty(window,\"" + n + "\",{configurable:true,get:function(){return " + n + "},set:function(v){try{" + n + "=v}catch(_){}}});";
  }).join("");
  (new Function(exported + "\n" + code))();
}
var RUN_DEFERRED = String(runDeferredScript);

// Inline HTML handlers execute in the global scope even when their implementation is in a
// module. Bridge only direct function calls named by those attributes; keep module-private
// state private and never overwrite browser globals or explicit window bindings.
function inlineHandlerBridge(html) {
  var names = [];
  html.replace(/<[^>]+>/g, function (tag) {
    tag.replace(/\s+on[\w]+\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+))/gi, function (_, double, single, bare) {
      (double || single || bare || '').replace(/(?:^|[^\w$.])([A-Za-z_$][\w$]*)\s*\(/g, function (_, name) {
        if (!/^(?:if|for|while|switch|catch|with|function|super|import|return|throw|new|delete|void|typeof|instanceof|in|yield|await|class|const|let|var|export|default|do|else|try|finally|case|break|continue|debugger|this|true|false|null)$/.test(name) && names.indexOf(name) === -1) names.push(name);
        return _;
      });
      return _;
    });
    return tag;
  });
  return names.map(function (name) {
    return '\n;try { if (typeof ' + name + ' === "function" && !("' + name + '" in window)) window["' + name + '"] = ' + name + '; } catch (_) {}';
  }).join('');
}

function scriptBindings(code) {
  var names = [];
  function binding(pattern) {
    if (!pattern) return;
    if (pattern.type === 'Identifier') { if (names.indexOf(pattern.name) === -1) names.push(pattern.name); }
    else if (pattern.type === 'RestElement') binding(pattern.argument);
    else if (pattern.type === 'AssignmentPattern') binding(pattern.left);
    else if (pattern.type === 'ArrayPattern') pattern.elements.forEach(binding);
    else if (pattern.type === 'ObjectPattern') pattern.properties.forEach(function (p) { binding(p.type === 'RestElement' ? p.argument : p.value); });
  }
  try {
    acorn.parse(code, { ecmaVersion: 'latest', sourceType: 'script' }).body.forEach(function (node) {
      if (node.type === 'VariableDeclaration') node.declarations.forEach(function (d) { binding(d.id); });
      else if (node.type === 'FunctionDeclaration' || node.type === 'ClassDeclaration') binding(node.id);
    });
  } catch (_) { /* Invalid source is still executed once to report its original syntax error. */ }
  return names;
}

function wrapClientScripts(html) {
  var bridge = inlineHandlerBridge(html);
  return html.replace(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi, function (match, attrs, code) {
    if (/\bsrc\s*=/i.test(attrs)) return match;
    var kind = isJsType(attrs);
    if (!kind) return match;
    if (kind === 'module') return bridge ? '<script' + attrs + '>' + code + bridge + '<\/script>' : match;
    if (MODULE_SYNTAX.test(code)) {
      return '<script' + attrs.replace(/\btype\s*=\s*["']?[^"'\s>]+["']?/i, '') + ' type="module">' + code + bridge + '<\/script>';
    }
    var trimmed = code.trim();
    if (!trimmed) return match;
    if (trimmed.indexOf('document.readyState') !== -1 && trimmed.indexOf('DOMContentLoaded') !== -1) {
      return match;
    }
    // Tailwind's Play CDN documents this snippet straight after its own <script> and reads the config as
    // it starts up, so when the library is already there the config runs now, in place. When it is not
    // (a page that writes the config above the CDN tag) it waits for the DOM like any other script, by
    // which time the library has loaded. Running it in place unconditionally threw "tailwind is not
    // defined" for that ordering, which the deferral used to forgive.
    var needsTailwind = /^tailwind\.config\s*=/.test(trimmed);
    var configNow = needsTailwind ? 'typeof tailwind !== "undefined" || ' : '';
    // Listen on document, before later document DOM-ready initializers: window receives the event
    // only after document listeners have already run. Keep declaration and initialization order.
    // The code is deferred until the DOM is ready, but it must still run as a real classic script.
    // It used to sit inside a function, which made every top-level function and const local to it, so
    // any `onclick="scrollToSection('x')"` in the page's markup threw "scrollToSection is not
    // defined". Handing the same text to a script element at that point runs it in the global scope
    // exactly as if the browser had met it there. The closing-tag and comment-opener sequences are
    // escaped because this text sits inside another script element, where either can end it early.
    // (Never write them out literally anywhere in this file's own script: the parser would stop here.)
    var literal = JSON.stringify(code).replace(/</g, '\\u003c');
    var wrapped = '\n(function(){\n' +
      '  var __ran = false, __waiting = false;\n' +
      '  function __runScript(){\n' +
      '    if (__ran) return;\n' +
      (needsTailwind ? '    if(typeof tailwind === "undefined") { var dep = Array.from(document.scripts).find(function(s){try{return new URL(s.src).hostname === "cdn.tailwindcss.com"}catch(_){return false}}); if(dep && !dep.__sfFailed){if(!__waiting){__waiting=true;dep.addEventListener("load",function(){if(typeof tailwind === "undefined")throw new Error("Tailwind CDN loaded without its configuration API");__runScript()},{once:true});}return;} }\n' : '') +
      '    __ran = true;\n' +
      '    (' + RUN_DEFERRED + ')(' + literal + ',' + JSON.stringify(scriptBindings(code)) + ');\n' +
      '  }\n' +
      '  if (' + configNow + 'document.readyState !== "loading") {\n' +
      '    __runScript();\n' +
      '  } else {\n' +
      '    document.addEventListener("DOMContentLoaded", __runScript);\n' +
      '  }\n' +
      '})();\n';
    return '<script' + attrs + '>' + wrapped + '<\/script>';
  });
}

// An import map for every bare specifier the page's inline modules use. A page that brings its own
// import map is left alone. three is pinned to one version, with its addons, so `three/addons/...`
// helpers and the page share a single copy; any other package is served by esm.sh.
function importMapFor(html) {
  if (/<script\b[^>]*type\s*=\s*["']?importmap/i.test(html)) return '';
  var imports = {};
  var found = false;
  html.replace(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi, function (m, attrs, code) {
    if (/\bsrc\s*=/i.test(attrs) || isJsType(attrs) !== 'module') return m;
    code.replace(/(?:\bfrom\s*|\bimport\s*\(?\s*)['"]([^'"]+)['"]/g, function (_, spec) {
      if (/^(?:\.{0,2}\/|[a-z][a-z0-9+.-]*:)/i.test(spec)) return _;
      found = true;
      if (spec === 'three' || spec.indexOf('three/') === 0) {
        imports['three'] = THREE_CDN + 'build/three.module.js';
        imports['three/addons/'] = THREE_CDN + 'examples/jsm/';
        imports['three/examples/jsm/'] = THREE_CDN + 'examples/jsm/';
      } else {
        var parts = spec.split('/');
        var pkg = spec.charAt(0) === '@' ? parts.slice(0, 2).join('/') : parts[0];
        if (!imports[pkg]) { imports[pkg] = 'https://esm.sh/' + pkg; imports[pkg + '/'] = 'https://esm.sh/' + pkg + '/'; }
      }
      return _;
    });
    return m;
  });
  if (!found) return '';
  return '<script type="importmap">' + JSON.stringify({ imports: imports }).replace(/</g, '\\u003c') + '<\/script>';
}

function withShim(html) {
  var wrapped = wrapClientScripts(html);
  var head = SHIM + importMapFor(wrapped);
  if (/<head[^>]*>/i.test(wrapped)) return wrapped.replace(/<head[^>]*>/i, function (m) { return m + head; });
  if (/<html[^>]*>/i.test(wrapped)) return wrapped.replace(/<html[^>]*>/i, function (m) { return m + head; });
  return head + wrapped;
}

// Refuse to render anything unless this document really is sandboxed and embedded by its parent.
// A document with a real origin (not "null") would run generated code with this app's access.
var OPAQUE = String(self.origin) === 'null';
var prevBlobUrl = null;
window.addEventListener('message', function (event) {
  var child = document.getElementById('preview-frame');
  if (child && event.source === child.contentWindow && event.data && typeof event.data === 'object' && event.data.type === 'sf-preview') {
    if (window.parent && window.parent !== window) {
      try { window.parent.postMessage(event.data, '*'); } catch (e) {}
    }
    return;
  }
  if (!OPAQUE || window.parent === window || event.source !== window.parent) return;
  var data = event.data;
  if (!data || typeof data !== 'object' || typeof data.html !== 'string') return;

  var existing = document.getElementById('preview-frame');
  if (existing) {
    try { existing.remove(); } catch (e) {}
  }
  if (prevBlobUrl) {
    try { URL.revokeObjectURL(prevBlobUrl); } catch (e) {}
    prevBlobUrl = null;
  }

  var frame = document.createElement('iframe');
  frame.id = 'preview-frame';
  frame.setAttribute('sandbox', 'allow-scripts allow-modals allow-forms');
  frame.setAttribute('title', 'Preview canvas');
  frame.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;border:none;margin:0;padding:0;display:block;';

  var prepared = withShim(data.html);

  // Sandboxed srcdoc bridge with robust Blob URL fallback
  if ('srcdoc' in frame) {
    frame.srcdoc = prepared;
  } else {
    try {
      var blob = new Blob([prepared], { type: 'text/html;charset=utf-8' });
      prevBlobUrl = URL.createObjectURL(blob);
      frame.src = prevBlobUrl;
    } catch (e) {
      frame.srcdoc = prepared;
    }
  }

  document.body.appendChild(frame);
});
</script>
</body>
</html>
