name: Web edition checks
on:
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
  push:
    branches: [main, feature/freetoken-web-ruflo]
    paths: ['web/**', '.github/workflows/web.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:server
      - run: npm run build
